<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Secret</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; display: inline-block; margin-right: 20px;}
        .auth-links { display: inline-block; }
    </style>
</head>
<body>
    <h1>Add New Secret</h1>
    <div class="auth-links">
        {% if current_user.is_authenticated %}
            <span>Logged in as: <strong>{{ current_user.username }}</strong></span> |
            <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
            <a href="{{ url_for('login') }}">Login</a> |
            <a href="{{ url_for('register') }}">Register</a>
        {% endif %}
    </div>

    <form action="{{ url_for('add_secret') }}" method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        <label for="value">Value:</label><br>
        <input type="text" id="value" name="value" required><br><br>
        <input type="submit" value="Add Secret">
    </form>
    <p><a href="{{ url_for('index') }}">Back to Home</a></p>
</body>
</html>
