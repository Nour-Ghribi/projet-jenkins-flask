<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Upload File to SFTP</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        label, input { display: block; margin-bottom: 10px; }
        input[type="file"] { margin-bottom: 15px; }
        input[type="submit"] { padding: 8px 15px; }
        a { text-decoration: none; color: #007bff; }
        a:hover { text-decoration: underline; }
        .flash { background-color: #dff0d8; color: #3c763d; border: 1px solid #d6e9c6; padding: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>Upload File to SFTP Server</h1>
    <p><a href="{{ url_for('index') }}">Back to Secrets</a></p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data">
        <label for="file">Choose file to upload:</label>
        <input type="file" id="file" name="file" required />
        <input type="submit" value="Upload" />
    </form>
</body>
</html>
