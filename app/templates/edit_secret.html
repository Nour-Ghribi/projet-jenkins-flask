<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Secret</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        label, input { display: block; margin-bottom: 10px; }
        input[type="text"] { width: 300px; padding: 5px; }
        input[type="submit"] { padding: 8px 15px; }
        .flash { background-color: #dff0d8; color: #3c763d; border: 1px solid #d6e9c6; padding: 10px; margin-bottom: 15px; }
        a { text-decoration: none; color: #007bff; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Edit Secret</h1>
    <p><a href="{{ url_for('index') }}">Back to Secrets</a></p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('edit_secret', secret_id=secret.id) }}" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ secret.name }}" required />

        <label for="value">Value:</label>
        <input type="text" id="value" name="value" value="{{ secret.decrypted_value }}" required />

        <input type="submit" value="Update Secret" />
    </form>
</body>
</html>
