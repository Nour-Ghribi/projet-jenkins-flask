version: '3.8'

services:
  flaskapp:
    build: .
    ports:
      - "5001:5000"
    environment:
      FLASK_SECRET_KEY: supersecretkey
      SFTP_HOST: sftp
      SFTP_PORT: 22
      SFTP_USER: foo
      SFTP_PASS: pass123
    depends_on:
      - sftp

  sftp:
    image: atmoz/sftp
    ports:
      - "2223:22"
    volumes:
      - sftp_data:/home/foo/upload
    command: /bin/sh -c "chown -R 1001:1001 /home/foo/upload && /entrypoint foo:pass123:1001"

volumes:
  sftp_data:
